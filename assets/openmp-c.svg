<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" role="img" aria-labelledby="title desc"><title id="title">Parallel loops in C with OpenMP</title><desc id="desc">A loop is distributed across four threads and partial sums are combined with a reduction.</desc><rect width="620" height="340" fill="#faf9f6"/><g font-family="Arial,sans-serif" fill="#292923"><text x="30" y="35" font-size="14" letter-spacing="1.3" fill="#927021">OPENMP / SHARED MEMORY</text><text x="30" y="74" font-size="28">Parallel loop and reduction</text><rect x="30" y="119" width="121" height="99" rx="5" fill="#eee9dc" stroke="#c4bba6"/><text x="90" y="151" text-anchor="middle" font-size="17">Loop iterations</text><text x="90" y="182" text-anchor="middle" font-size="23" font-family="monospace">i = 1…N</text><g stroke="#b1a48a" fill="none" stroke-width="1.4"><path d="M151 168H179V118H210M179 168V153H210M179 168V188H210M179 188V223H210M384 118H425V168H454M384 153H425M384 188H425M384 223H425V168"/></g><g fill="#f0e2cc" stroke="#c3a46c"><rect x="210" y="104" width="174" height="28" rx="4"/><rect x="210" y="139" width="174" height="28" rx="4"/><rect x="210" y="174" width="174" height="28" rx="4"/><rect x="210" y="209" width="174" height="28" rx="4"/></g><g font-size="15"><text x="226" y="123">Thread 0 · partial sum</text><text x="226" y="158">Thread 1 · partial sum</text><text x="226" y="193">Thread 2 · partial sum</text><text x="226" y="228">Thread 3 · partial sum</text></g><circle cx="483" cy="168" r="29" fill="#a84421"/><text x="483" y="178" text-anchor="middle" font-size="30" fill="white">Σ</text><text x="483" y="224" text-anchor="middle" font-size="15">Reduction</text><text x="30" y="291" font-family="monospace" font-size="15" fill="#a84421">parallel for · private variables · reduction(+:sum)</text><text x="30" y="319" font-size="13" fill="#777062">Programming exercise · conceptual diagram</text></g></svg>
