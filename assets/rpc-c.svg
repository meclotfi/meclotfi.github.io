<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" role="img" aria-labelledby="title desc"><title id="title">RPC calculator in C</title><desc id="desc">A C client serializes two integer arguments using generated RPC stubs and sends a UDP request to an addition server. The response contains the sum and an error field.</desc><rect width="620" height="340" fill="#faf9f6"/><g font-family="Arial,sans-serif" fill="#292923"><text x="30" y="35" font-size="14" letter-spacing="1.3" fill="#927021">C / REMOTE PROCEDURE CALL</text><text x="30" y="74" font-size="28">Client → server → response</text><rect x="30" y="125" width="160" height="116" rx="5" fill="#eee9dc" stroke="#c4bba6"/><text x="50" y="157" font-size="21">C client</text><text x="50" y="187" font-size="15" font-family="monospace">arg1, arg2</text><text x="50" y="213" font-size="14" fill="#777062">Generated RPC stub</text><rect x="431" y="125" width="159" height="116" rx="5" fill="#f3e3d4" stroke="#b87551"/><text x="451" y="157" font-size="21">C server</text><text x="451" y="187" font-size="15" font-family="monospace">addition(a,b)</text><text x="451" y="213" font-size="14" fill="#777062">Overflow check</text><path d="M190 153H423M417 148L423 153L417 158" fill="none" stroke="#a84421" stroke-width="1.6"/><path d="M431 217H198M204 212L198 217L204 222" fill="none" stroke="#927021" stroke-width="1.6"/><text x="310" y="133" text-anchor="middle" font-size="15" fill="#a84421">XDR request · UDP</text><text x="310" y="242" text-anchor="middle" font-size="15" fill="#927021">sum + error code</text><text x="30" y="291" font-size="15" font-family="monospace">calc.x → rpcgen → C stubs + XDR serialization</text><text x="30" y="319" font-size="13" fill="#777062">Client–server exercise · conceptual diagram</text></g></svg>
